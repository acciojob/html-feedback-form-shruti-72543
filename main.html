<!DOCTYPE html>

<html>

<head>

</head>

<body>
	<!-- the entire body must be written by student -->
	<form action="" method="post">
		<h1>"Feedback Form"</h1>
        <label for="name">Name:</label>
		<input type="text" id="name" 
			minlength="3" maxlength="50" required></input><br>
		
        <label for="portfolio">Portfolio:</label>
		<input type="URL" id="portfolio" required></input><br>

		<label for="favColor">Favourite Color:</label>
		<input type="color" id="favColor"  ></input><br>

		<label for="likeness">Likeness:</label>
		<input type="Range" id="likeness" min="1" max="100" required></input><br>

		<button type="submission">Submit:</button><br>
	</form>
		
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
